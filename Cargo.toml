[package]
# crates.io distribution name (matches the PyPI ``anchorpy3-core`` name).
# The Python module name is set by ``[lib] name`` below, which stays
# ``anchorpy_core`` so consumers keep using ``import anchorpy_core``.
name = "anchorpy3-core"
version = "0.4.0"
edition = "2021"
include = ["/src", "/LICENSE", "/pyproject.toml"]
description = "Python bindings for Anchor Rust code"
license = "Apache-2.0"
repository = "https://github.com/kakagri/anchorpy-core"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "anchorpy_core"
crate-type = ["cdylib", "rlib"]

[features]
# ``extension-module`` is off by default so plain ``cargo build`` (and any
# Rust crate that depends on us via crates.io) links against libpython
# normally. When building the Python wheel with maturin the feature is
# enabled — see ``[tool.maturin] features`` in pyproject.toml — which makes
# pyo3 skip the libpython link, leaving the Python C-API symbols to be
# resolved at runtime by the embedding interpreter.
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.17.2", features = ["abi3-py37"] }
solders-macros = "0.6.0"
derive_more = "0.99.17"
anchor-lang-idl = { version = "0.1.2" }
serde = { version = "1.0.147", features = ["derive"] }
solders-traits = "0.9.3"
serde_json = "1.0.87"
pythonize = "0.17.0"
