name: release

on:
  release:
    types: [published]
jobs:
  release_pypi:
    runs-on: ubuntu-latest
    steps:
      # ``upload-artifact@v4`` requires unique artifact names, so each build
      # job uploads to ``wheels-<platform>-<target>``. Match them all by
      # regex and collapse into a single ``dist/`` directory for maturin.
      - uses: dawidd6/action-download-artifact@v6
        with:
          workflow: build.yml
          name: wheels-.*
          name_is_regexp: true
          path: dist
          merge_multiple: true
      - name: Publish to PyPi
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        uses: messense/maturin-action@v1
        with:
          command: upload
          args: --skip-existing dist/*

  release_crate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
