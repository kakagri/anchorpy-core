name: release

on:
  release:
    types: [published]
jobs:
  release_pypi:
    runs-on: ubuntu-latest
    steps:
      # ``upload-artifact@v4`` requires unique artifact names, so each build
      # job uploads to ``wheels-<platform>-<target>``. Match them all by
      # regex and pin to the commit this release was cut from — otherwise
      # the action grabs the latest globally-matching build.yml run, which
      # can be from a previous publish cycle whose artifacts have already
      # expired (GitHub deletes artifacts after 90 days by default).
      - uses: dawidd6/action-download-artifact@v6
        with:
          workflow: build.yml
          workflow_conclusion: success
          # ``github.sha`` on a release event is the tagged commit's SHA.
          # ``release.target_commitish`` is a branch name when the release was
          # created via the UI/API without explicit SHA, which won't match the
          # dawidd6 commit filter.
          commit: ${{ github.sha }}
          name: wheels-.*
          name_is_regexp: true
          path: dist
      # The action extracts each artifact into its own subdirectory under
      # ``dist/`` (``merge_multiple`` is not supported on v6 — silently
      # ignored if passed). Flatten into a single directory so the maturin
      # upload glob is simple.
      - name: Flatten downloaded artifacts
        run: |
          mkdir -p dist-flat
          find dist -type f \( -name '*.whl' -o -name '*.tar.gz' \) -exec mv {} dist-flat/ \;
          ls -la dist-flat/
      - name: Publish to PyPi
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        uses: messense/maturin-action@v1
        with:
          command: upload
          args: --skip-existing dist-flat/*

  release_crate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # ``cargo publish`` has no ``--skip-existing`` flag, so detect the
      # already-published case explicitly and exit 0 — letting release.yml
      # be re-runnable for the same tag without manual cleanup.
      - run: |
          if cargo publish 2>&1 | tee /tmp/cargo_out; then
            exit 0
          fi
          if grep -q "already exists on crates.io" /tmp/cargo_out; then
            echo "::notice::crate version already on crates.io — skipping"
            exit 0
          fi
          exit 1
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
